<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Tu recuerdo · Mao details</title>
<meta name="theme-color" content="#6B1E2E">
<link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/css/estilos.css">
<style>
  html, body { height: 100%; overflow: hidden; background: #000; }
  .pantalla { position: fixed; inset: 0; z-index: 20; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
    padding: max(24px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom)); color: var(--marfil); }
  .pantalla[hidden] { display: none; }
  .pantalla .marco-pantalla { position: absolute; inset: 14px; border: 2px solid var(--dorado); pointer-events: none; }
  .pantalla .marco-pantalla::before { content: ""; position: absolute; inset: 6px; border: 1px solid var(--dorado); }
  .pantalla img.logo { width: 120px; margin-bottom: 26px; }
  .pantalla h1 { color: var(--marfil); font-size: clamp(2.2rem, 9vw, 3.2rem); margin-bottom: 6px; }
  .pantalla h1 em { color: var(--dorado); }
  .pantalla .para { font-family: var(--script); font-size: 2.2rem; color: var(--dorado-cl); margin: 0 0 18px; min-height: 1em; }
  .pantalla p { max-width: 30ch; margin: 0 auto 26px; color: var(--rosa); }
  .pantalla .pequeno { font-size: .8rem; color: var(--dorado-cl); margin-top: 18px; }
  .pantalla .enlace { background: none; border: 0; color: var(--dorado-cl); text-decoration: underline; font: inherit; font-size: .9rem; cursor: pointer; margin-top: 14px; }

  /* Guía de escaneo */
  #guia { position: fixed; inset: 0; z-index: 10; pointer-events: none; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  #guia[hidden] { display: none; }
  #guia .visor { width: min(72vw, 72vh, 360px); aspect-ratio: 1; position: relative; }
  #guia .visor i { position: absolute; width: 44px; height: 44px; border: 4px solid var(--dorado); animation: latir 1.6s ease-in-out infinite; }
  #guia .visor i:nth-child(1) { top: 0; left: 0; border-right: 0; border-bottom: 0; }
  #guia .visor i:nth-child(2) { top: 0; right: 0; border-left: 0; border-bottom: 0; }
  #guia .visor i:nth-child(3) { bottom: 0; left: 0; border-right: 0; border-top: 0; }
  #guia .visor i:nth-child(4) { bottom: 0; right: 0; border-left: 0; border-top: 0; }
  @keyframes latir { 50% { transform: scale(1.08); opacity: .7; } }
  .burbuja { margin-top: 26px; background: rgba(74,20,32,.88); color: var(--marfil); padding: 12px 20px; border-radius: 999px; font-size: .9rem; letter-spacing: .04em; border: 1px solid rgba(201,163,92,.6); }

  /* Barra inferior mientras se ve el video */
  #barra { position: fixed; left: 50%; bottom: max(18px, env(safe-area-inset-bottom)); transform: translateX(-50%); z-index: 15; display: flex; gap: 10px; }
  #barra[hidden] { display: none; }
  #barra button { min-height: 46px; padding: 0 18px; border-radius: 999px; border: 1px solid rgba(201,163,92,.7); background: rgba(74,20,32,.88); color: var(--marfil); font: 600 .72rem/1 var(--sans); letter-spacing: .16em; text-transform: uppercase; cursor: pointer; }

  /* Video sin cámara */
  #solo-video { position: fixed; inset: 0; z-index: 30; background: var(--vino-osc); display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; }
  #solo-video[hidden] { display: none; }
  #solo-video video { width: min(92vw, 70vh); max-height: 70vh; background: #000; border: 3px solid var(--dorado); }
  #solo-video button { margin-top: 18px; }

  #escena-contenedor { position: fixed; inset: 0; }
  .a-enter-vr, .a-enter-ar, .a-orientation-modal { display: none !important; }
  .mindar-ui-overlay { display: none !important; }
</style>
</head>
<body>

<!-- 1. Bienvenida -->
<section class="pantalla patron-vino" id="bienvenida">
  <div class="marco-pantalla"></div>
  <img class="logo" src="assets/img/isotipo.svg" alt="Mao details">
  <p class="sobretitulo">Alguien guardó un recuerdo</p>
  <p class="para" id="txt-para"></p>
  <h1>Tu recuerdo <em>te espera</em></h1>
  <p id="txt-mensaje">Toca el botón, permite la cámara y apunta a la foto de la tapa.</p>
  <button class="boton boton-dorado" id="btn-iniciar" disabled>Cargando…</button>
  <p class="pequeno">🔊 Sube el volumen</p>
  <button class="enlace" id="btn-solo-video" hidden>Ver el video sin cámara</button>
</section>

<!-- 2. Error / no encontrado -->
<section class="pantalla patron-vino" id="error" hidden>
  <div class="marco-pantalla"></div>
  <img class="logo" src="assets/img/isotipo.svg" alt="Mao details">
  <h1>Algo <em>no cargó</em></h1>
  <p id="txt-error">Revisa tu conexión a internet e intenta de nuevo.</p>
  <button class="boton boton-dorado" onclick="location.reload()">Intentar de nuevo</button>
  <button class="enlace" id="btn-solo-video-2" hidden>Ver el video sin cámara</button>
</section>

<!-- 3. Guía mientras busca la foto -->
<div id="guia" hidden>
  <div class="visor"><i></i><i></i><i></i><i></i></div>
  <div class="burbuja" id="txt-guia">Apunta a la foto de la tapa</div>
</div>

<div id="barra" hidden>
  <button id="btn-sonido">🔊 Sonido</button>
  <button id="btn-repetir">↺ Repetir</button>
</div>

<div id="solo-video" hidden>
  <video id="video-plano" controls playsinline></video>
  <button class="boton boton-borde" style="color:var(--marfil)" id="btn-cerrar-video">Volver</button>
</div>

<div id="escena-contenedor"></div>

<script src="vendor/aframe-v1.5.0.min.js"></script>
<script src="vendor/mindar-image-aframe.prod.js"></script>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var params = new URLSearchParams(location.search);
  var id = (params.get("p") || "").replace(/[^a-zA-Z0-9_-]/g, "");
  var base = "pedidos/" + id + "/";
  var cfg = null, video = null, iniciado = false;

  function mostrarError(msg, permitirVideo) {
    $("bienvenida").hidden = true; $("guia").hidden = true; $("barra").hidden = true;
    $("txt-error").textContent = msg; $("error").hidden = false;
    if (permitirVideo && cfg) $("btn-solo-video-2").hidden = false;
  }

  function verSinCamara() {
    var v = $("video-plano");
    v.src = base + cfg.video; $("solo-video").hidden = false;
    v.play().catch(function () {});
  }
  $("btn-solo-video").onclick = verSinCamara;
  $("btn-solo-video-2").onclick = verSinCamara;
  $("btn-cerrar-video").onclick = function () { var v = $("video-plano"); v.pause(); $("solo-video").hidden = true; };

  if (!id) { mostrarError("Este enlace no tiene un código de caja. Escanea de nuevo el QR de la tapa."); return; }

  fetch(base + "config.json", { cache: "no-store" })
    .then(function (r) { if (!r.ok) throw new Error("404"); return r.json(); })
    .then(function (c) {
      cfg = c;
      if (c.para) $("txt-para").textContent = "Para " + c.para;
      if (c.mensaje) $("txt-mensaje").textContent = c.mensaje;
      construirEscena();
    })
    .catch(function () { mostrarError("No encontramos esta caja. Revisa que el QR esté completo o escríbenos a @mao.details."); });

  function construirEscena() {
    var cont = $("escena-contenedor");
    cont.innerHTML =
      '<a-scene id="escena" mindar-image="imageTargetSrc: ' + base + (cfg.target || "target.mind") + '; autoStart: false; uiLoading: no; uiScanning: no; uiError: no; filterMinCF: 0.0001; filterBeta: 0.001; missTolerance: 10; warmupTolerance: 3" ' +
      'color-space="sRGB" renderer="colorManagement: true; antialias: true" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false" loading-screen="enabled: false">' +
        '<a-assets timeout="20000"><video id="vid" preload="auto" loop playsinline webkit-playsinline crossorigin="anonymous"></video></a-assets>' +
        '<a-camera position="0 0 0" look-controls="enabled: false" cursor="rayOrigin: mouse"></a-camera>' +
        '<a-entity id="objetivo" mindar-image-target="targetIndex: 0">' +
          '<a-plane id="marco" width="1.06" height="1.06" position="0 0 -0.01" color="#C9A35C" visible="false"></a-plane>' +
          '<a-video id="plano" src="#vid" width="1" height="1" position="0 0 0" visible="false"></a-video>' +
        '</a-entity>' +
      '</a-scene>';
    video = document.getElementById("vid");
    video.src = base + cfg.video;
    video.addEventListener("loadedmetadata", function () {
      // Ajusta el plano a la proporción del video, a lo ancho de la foto
      var r = video.videoHeight / video.videoWidth || 1;
      var w = 1, h = r;
      if (cfg.ajuste === "alto") { h = 1; w = 1 / r; }
      $("plano").setAttribute("width", w); $("plano").setAttribute("height", h);
      $("marco").setAttribute("width", w + 0.06); $("marco").setAttribute("height", h + 0.06);
    });
    var escena = document.getElementById("escena");
    var listo = function () { $("btn-iniciar").disabled = false; $("btn-iniciar").textContent = "Ver mi recuerdo"; $("btn-solo-video").hidden = false; };
    if (escena.hasLoaded) listo(); else escena.addEventListener("loaded", listo);

    var obj = document.getElementById("objetivo");
    obj.addEventListener("targetFound", function () {
      $("guia").hidden = true; $("barra").hidden = false;
      $("plano").setAttribute("visible", true); $("marco").setAttribute("visible", true);
      video.play().catch(function () { video.muted = true; video.play().catch(function () {}); $("btn-sonido").textContent = "🔇 Activar sonido"; });
      if (navigator.vibrate) navigator.vibrate(30);
    });
    obj.addEventListener("targetLost", function () {
      video.pause(); $("guia").hidden = false; $("txt-guia").textContent = "Vuelve a apuntar a la foto";
    });
    escena.addEventListener("arReady", function () { $("guia").hidden = false; });
    escena.addEventListener("arError", function () {
      mostrarError("No pudimos abrir la cámara. Revisa que le diste permiso a este navegador, o mira el video sin cámara.", true);
    });
  }

  $("btn-iniciar").onclick = function () {
    if (iniciado) return; iniciado = true;
    // Desbloquea el audio con el toque del usuario (necesario en iPhone)
    video.muted = false;
    var p = video.play(); if (p && p.then) p.then(function () { video.pause(); video.currentTime = 0; }).catch(function () {});
    $("bienvenida").hidden = true; $("guia").hidden = false; $("txt-guia").textContent = "Abriendo la cámara…";
    var sys = document.getElementById("escena").systems["mindar-image-system"];
    sys.start();
    setTimeout(function () { if (!$("guia").hidden) $("txt-guia").textContent = "Apunta a la foto de la tapa"; }, 2500);
  };
  $("btn-sonido").onclick = function () { video.muted = !video.muted; if (!video.muted) video.play().catch(function () {}); this.textContent = video.muted ? "🔇 Activar sonido" : "🔊 Sonido"; };
  $("btn-repetir").onclick = function () { video.currentTime = 0; video.play().catch(function () {}); };
})();
</script>
</body>
</html>
